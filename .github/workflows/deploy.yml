name: Deploy Lambda Function

on:
  push:
    branches:
      - develop
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  id-token: write # Required for OIDC authentication with AWS
  contents: read

env:
  AWS_REGION: us-east-1
  FUNCTION_NAME: templevis
  LAYER_NAME: templevis-dependencies
  DEPLOY_ROLE_ARN: arn:aws:iam::269038874049:role/GitHubActionsDeployRole

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug OIDC Token Claims
        run: |
          ACTIONS_ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== OIDC TOKEN PAYLOAD ==="
          echo "$ACTIONS_ID_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set Deployment Variables
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "LAYER_BUCKET=templevis-lambda-layers-${ACCOUNT_ID}-${AWS_REGION}" >> "$GITHUB_ENV"
          echo "LAYER_S3_KEY=layers/templevis-layer-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"

      - name: Validate Layer Bucket Access
        run: |
          if aws s3api head-bucket --bucket "${LAYER_BUCKET}" 2>/dev/null; then
            echo "Layer bucket is accessible: ${LAYER_BUCKET}"
          else
            echo "Layer bucket is not accessible: ${LAYER_BUCKET}"
            echo "Create it outside this workflow or grant bucket access to the deploy role."
            exit 1
          fi

      - name: Build and Publish Lambda Layer
        run: |
          rm -rf build
          mkdir -p build/layer/python

          pip install --upgrade pip
          pip install . -t build/layer/python

          test -f build/layer/python/templevis/table_processor.py
          test -f build/layer/python/templevis/excel_generator.py

          cd build/layer
          zip -r ../templevis-layer.zip .
          cd ../..

          echo "Layer package size:"
          du -h build/templevis-layer.zip

          aws s3 cp build/templevis-layer.zip "s3://${LAYER_BUCKET}/${LAYER_S3_KEY}"

          LAYER_VERSION_ARN=$(aws lambda publish-layer-version \
            --layer-name "${LAYER_NAME}" \
            --description "TempleVis dependencies ${GITHUB_SHA}" \
            --compatible-runtimes python3.11 \
            --content S3Bucket="${LAYER_BUCKET}",S3Key="${LAYER_S3_KEY}" \
            --query LayerVersionArn \
            --output text)

          echo "LAYER_VERSION_ARN=${LAYER_VERSION_ARN}" >> "$GITHUB_ENV"
          echo "Published layer: ${LAYER_VERSION_ARN}"

      - name: Build Deployment Package
        run: |
          rm -rf package
          mkdir -p package
          cp src/templevis/lambda/lambda_handler.py package/
          cd package
          zip -r ../lambda_deployment.zip .
          cd ..

          echo "Function package size:"
          du -h lambda_deployment.zip

      - name: Deploy to AWS Lambda
        env:
          LAMBDA_EXECUTION_ROLE_ARN: "arn:aws:iam::269038874049:role/templevis-IAMRoleLambdaExec"
        run: |
          # 1. First attempt to update existing code directly
          echo "Attempting to update existing Lambda function code for: ${FUNCTION_NAME}..."
          if aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --zip-file "fileb://lambda_deployment.zip" \
            --region "${AWS_REGION}"; then
            
            echo "Successfully updated function code."

            # Wait until function update is complete before config update
            aws lambda wait function-updated \
              --function-name "${FUNCTION_NAME}" \
              --region "${AWS_REGION}"

            # Attach latest dependency layer
            aws lambda update-function-configuration \
              --function-name "${FUNCTION_NAME}" \
              --layers "${LAYER_VERSION_ARN}" \
              --region "${AWS_REGION}"

            echo "Successfully updated function configuration with layer: ${LAYER_VERSION_ARN}"
          else
            echo "Function code update failed. Creating new Lambda function..."
            aws lambda create-function \
              --function-name "${FUNCTION_NAME}" \
              --runtime python3.11 \
              --role "${LAMBDA_EXECUTION_ROLE_ARN}" \
              --handler lambda_handler.lambda_handler \
              --layers "${LAYER_VERSION_ARN}" \
              --zip-file "fileb://lambda_deployment.zip" \
              --region "${AWS_REGION}"

            echo "Successfully created function with layer: ${LAYER_VERSION_ARN}"
          fi
